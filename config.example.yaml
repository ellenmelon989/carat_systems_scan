# Scan configuration for MPCVD 2D diagnostic scanner
# Fill in real values as hardware is confirmed.

scan:
  grid:
    x_range_mm: [0, 50]      # scan area boundary — set by calibrate_scan_area.py (jog to edges)
    y_range_mm: [0, 50]      # scan area boundary — set by calibrate_scan_area.py (jog to edges)
    wafer_center_mm: [25.0, 25.0]   # derived by calibrate_scan_area.py from the 4 edge positions
    step_size_mm: 2.0        # grid spacing in mm; valid range 1-11mm (see scan_params.py).
                              # nx/ny are DERIVED from this + the range above at scan time —
                              # not set directly. A zero-width range on one axis collapses
                              # that axis to a single point (line/point scan), automatically.
  scan_order: raster   # raster | serpentine
  dwell_time_s: 8.0     # per-point IR averaging duration; valid range 2-22s (see scan_params.py)
  settle_time_s: 0.5
  passes: 1             # number of full-grid passes; valid range 1-50 (see scan_params.py).
                         # >1 repeats the ENTIRE grid that many times so every point gets
                         # rechecked over the course of the scan (not just reference_point
                         # below) — needed for per-point drift/oscillation tracking over time.
                         # Each pass roughly multiplies total scan time; 1 = old behavior.
  reference_point:
    enabled: true
    revisit_every_n_points: 25
    position: [0, 0]  # placeholder
  rehome:
    # Re-homes the motion axes periodically to reset open-loop position
    # drift (Newport picomotors have no encoder — error accumulates with
    # step count). Off by default; enable for long/high-point-count scans.
    enabled: false
    every_n_points: 200

motion:
  # 2026-07-29: switched from newport_8742 (open-loop picomotor + 8816-6) to
  # conex_agap (closed-loop CONEX-AGAP + AG-M100D mirror mount) -- see
  # motion/real_conexagap_motion.py's module docstring for the full
  # rationale and the state-machine differences. This controller has its
  # OWN deg_per_mm_x/y config keys (2026-08 -- no longer reusing the 8742's
  # steps_per_mm_x/y name; that reuse turned out to make the calibration
  # workflow harder to reason about, not easier, and is what let a
  # leftover 8742-scale value silently survive a controller swap).
  # The old newport_8742 block is kept commented out below for reference/
  # rollback -- don't delete it until the CONEX-AGAP is confirmed reliable
  # on-site.
  #
  # 2026-08-18: user decided to REPLACE this controller entirely with the
  # Optotune MR-15-30 + MR-E-3 (see the "NEXT hardware (mr1530...)" draft
  # block below and docs/mr1530_migration_plan.md). Still active here
  # because the new driver is a scaffold pending Optotune's protocol docs
  # and the hardware hasn't shipped -- don't switch `controller:` to
  # mr1530 until that block's TODOs are resolved.
  controller: conex_agap
  port: "COM4"                # REQUIRED -- Windows COM port (Device Manager >
                               # Ports (COM & LPT), once the Newport USB driver
                               # from "USB Driver Installation Manual.pdf" is
                               # installed). Find with:
                               #   python motion/real_conexagap_motion.py --list-ports
  controller_address: 1       # CONEX-AGAP factory default over USB (only
                               # matters if reconfigured for RS-485).
  motion_enabled: false       # FAIL-CLOSED operator interlock. Leave false
                               # during connection checks and axis recovery.
  calibration_confirmed: false # INFORMATIONAL ONLY as of 2026-08-06 -- nothing
                                # reads this. move_to() no longer requires it;
                                # a scan can run with deg_per_mm_x/y still at
                                # the placeholder if you choose to.
  axis_x: "U"                 # which CONEX axis LETTER ('U' or 'V') drives
  axis_y: "V"                 # scan-grid X/Y -- CONFIRM by jogging each letter
                               # individually and watching the mirror, same as
                               # axis_x/axis_y were confirmed for the 8742.
                               # Don't assume U=X.
  deg_per_mm_x: 0.05          # degrees of mirror tilt per mm at the wafer --
  deg_per_mm_y: 0.05          # PLACEHOLDER, calibrate on-site. Use the
                               # Calibrate tab / calibrate_scan_area.py's
                               # degree-first workflow: jog in native degrees
                               # (safe regardless of this value, see
                               # calibration_jog_deg()/get_position_deg() in
                               # real_conexagap_motion.py) to the wafer edges,
                               # then supply a known true distance (e.g. wafer
                               # diameter) to derive this directly -- no need
                               # to already know it first.
  invert_x: false             # set true if jogging +X/+Y ever visibly moves
  invert_y: false             # the mirror the OPPOSITE direction on-site --
                               # re-verify independently of the 8742's old
                               # invert_y: true, wiring may differ on the new
                               # mount.
  calibration_date: null           # fill in: date deg_per_mm_x/y was actually measured
  calibration_direction: null      # fill in: "+x"/"-x"/"+y"/"-y"
  hard_home: false            # false = anchor origin at current position when
                               # home() is called (fiducial workflow, same as
                               # before). true = anchor at the CONEX-AGAP's own
                               # absolute zero (0 deg both axes) -- see module
                               # docstring's HOMING / ORIGIN section for why
                               # that's safe here (repeatable closed-loop
                               # reading) unlike the 8742's hard-stop crash-
                               # into-a-wall homing.
  move_timeout_s: 30          # per-axis move timeout (settle poll)
  stop_confirm_timeout_s: 10  # how long to wait for an explicit ST to land
  serial_timeout_s: 2         # seconds to wait for each controller reply
  homing_required: true
  soft_limits:
    x_min_mm: 0
    x_max_mm: 50
    y_min_mm: 0
    y_max_mm: 50
    # NOTE: the CONEX-AGAP's own hardware software limits (SL/SR) cap each
    # axis to roughly +/-1 degree of mirror tilt -- a much smaller absolute
    # range than the 8742's open-loop step space. Once deg_per_mm_x/y are
    # calibrated for real, double check these mm limits still map to
    # something inside +/-1 deg, don't just carry over the 8742's numbers
    # unchanged.

  # --- NEXT hardware (mr1530: Optotune MR-15-30 + MR-E-3, closed-loop FSM) ---
  # 2026-08-18: user decided this REPLACES conex_agap entirely (not an
  # addition). DRAFT block, v2 -- motion/real_mr1530_motion.py now
  # implements move_to()/wait_for_settle()/home() (hard_home path) for
  # real, against Optotune's published Operation Manual protocol, but
  # get_position() and everything downstream of it (fiducial homing,
  # calibration jogging) still raise NotImplementedError pending a
  # position-readback architecture decision -- see
  # docs/mr1530_migration_plan.md section 3b. Do not uncomment/activate
  # this block for real scanning until that's resolved and the driver's
  # been exercised against a fake-serial simulator, same verification
  # approach used before the CONEX-AGAP first touched real hardware.
  # controller: mr1530
  # port: "COMn"               # Windows COM port once the MR-E-3 USB driver
  #                            # is installed -- find via Device Manager or
  #                            # `python motion/real_mr1530_motion.py --list-ports`
  # motion_enabled: false      # FAIL-CLOSED operator interlock, same pattern
  #                            # as conex_agap.
  # deg_per_mm_x: ???          # NO SAFE PLACEHOLDER -- unlike conex_agap's 0.05,
  # deg_per_mm_y: ???          # this device's mount geometry/throw distance
  #                            # hasn't been characterized. Must be calibrated
  #                            # on-site before this driver's __init__ will even
  #                            # accept it (see real_mr1530_motion.py). Same
  #                            # convention as conex_agap: MECHANICAL degrees
  #                            # of mirror tilt per mm -- the driver handles
  #                            # the mechanical->optical->normalized-XY
  #                            # conversion internally.
  # invert_x: false            # re-verify independently on real wiring -- don't
  # invert_y: false            # assume conex_agap's invert_y carries over.
  #                            # (axis_x/axis_y are NOT needed for this
  #                            # controller -- confirmed the MR-E-3 addresses
  #                            # X/Y directly, unlike conex_agap's U/V letters.)
  # hard_home: true            # true -> XY=0;0 (unit-circle center, always
  #                            # valid) -- the only home() path implemented
  #                            # so far. false (fiducial soft-home) is NOT
  #                            # yet implemented -- needs get_position() to
  #                            # be real first, see migration plan 3b.
  # move_timeout_s: 30
  # soft_limits:
  #   x_min_mm: 0
  #   x_max_mm: 50
  #   y_min_mm: 0
  #   y_max_mm: 50
  #   # NOTE: this device's reachable range is a UNIT CIRCLE (X^2+Y^2<=1 in
  #   # its own normalized coordinates, corresponding to +/-25 deg
  #   # mechanical / +/-50 deg optical in any direction), not two
  #   # independent per-axis limits like conex_agap's SL/SR -- do NOT carry
  #   # conex_agap's soft_limits over unchanged; they need a fresh value
  #   # sized to the real throw distance and this different constraint
  #   # shape.

  # --- Previous hardware (newport_8742 + 8816-6, open-loop picomotor) ---
  # controller: newport_8742
  # interface: usb            # "usb" or "ethernet"
  # host: "192.168.100.2"     # only used when interface: ethernet — replace with actual IP
  # usb_index: 0              # only used when interface: usb
  # steps_per_mm_x: 500       # fill in after calibration
  # steps_per_mm_y: 500       # fill in after calibration
  # invert_x: false           # set true if jogging +X/+Y ever visibly moves the mirror the
  # invert_y: false           # OPPOSITE direction on-site -- a wiring/mounting fact, found by
  #                            # jogging and watching, not something to guess in advance. See
  #                            # motion/real_newport_motion.py's module docstring for why this
  #                            # is separate from steps_per_mm_x/y's own (always-positive) sign.
  # calibration_date: null
  # calibration_velocity_sps: null
  # calibration_direction: null
  # home_velocity: 200        # steps/s during homing (slow, avoids crashing into hard stop)
  # home_steps: 100000        # max steps driven toward the hard stop during a hard home.
  # home_timeout_s: 300
  # move_velocity: 2000       # steps/s during scan moves — calibrate steps_per_mm at THIS velocity
  # axis_x: 1
  # axis_y: 2
  # hard_home: false
  # soft_limits:
  #   x_min_mm: 0
  #   x_max_mm: 50
  #   y_min_mm: 0
  #   y_max_mm: 50

ir:
  source: pac          # pac | mock — REST/PAC is the only real backend wired up
                        # (direct-tap/OptoMMP fallbacks exist as prototypes in the
                        # older "carat system" folder but aren't ported in here;
                        # decided 2026-07-11 that we only need REST for now)
  pac:
    ip: ""           # confirm on-site
    temp_tag_name: "iai_PYRO_TEMP"             # confirmed
    emissivity_tag_name: "iai_PYRO_EMISSIVITY" # confirmed
    dilution_tag_name: ""    # pyro signal dilution strength — NOT confirmed yet
                              # (2026-07-21). TrendWater[4]/PyroValues[6] are PAC
                              # DISPLAY Float Table addresses, not REST strategy
                              # variable names like iai_PYRO_TEMP — the actual
                              # name has to be looked up separately. Run
                              # tools/list_pac_strategy_vars.py against this IP,
                              # or check PAC Control (Debug > Inspect) for
                              # whatever feeds TrendWater[4]/PyroValues[6].
                              # Left blank = dilution is skipped entirely
                              # (IRReading.dilution stays None) until this is
                              # filled in — nothing else needs to change.
    api_key_id: "carat_scanner"
    api_key_value: ""
  # averaging_time_s removed — superseded by scan.dwell_time_s (single operator-facing knob)
  units: C

oes:
  backend: mock        # mock | pyseabreeze
  integration_time_us: 20000
  num_averages: 3
  boxcar_width: 2
  features:
    CH: 431.0
    C2_Swan: 516.0
    H_alpha: 656.3
    H_beta: 486.1
  feature_window_nm: 1.0

error_policy:
  max_retries: 2
  on_failure: nan_and_flag   # nan_and_flag | abort

output:
  base_dir: ./scan_data       # PARENT dir -- ScanManager auto-appends a
                               # scan_<YYYYMMDD_HHMMSS> subfolder per run
                               # (see resolve_run_dir() in data_logger.py),
                               # so this value itself never changes between
                               # runs and every scan still gets its own
                               # dated, non-colliding output directory.
  spectra_subdir: spectra
  summary_csv: scan_summary.csv
  metadata_file: metadata.yaml
  log_file: scan_log.txt

metadata:
  operator: null
  reactor_run_number: null
  calibration_notes: null
